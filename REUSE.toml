version = 1
SPDX-PackageName = "water-meter-counter"
SPDX-PackageDownloadLocation = "https://github.com/usimd/water-meter-counter"

# Hardware: schematic, PCB, footprints, housing, renders and documentation.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2025-2026 usimd"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# Firmware, build and CI files. Our own sources also carry SPDX headers.
[[annotations]]
path = ["firmware/**", ".github/**"]
SPDX-FileCopyrightText = "2025-2026 usimd"
SPDX-License-Identifier = "Apache-2.0"

# Drivers generated by MPLAB Code Configurator, under Microchip's terms.
[[annotations]]
path = "firmware/mcc_generated_files/**"
SPDX-FileCopyrightText = "Microchip Technology Inc. and its subsidiaries"
SPDX-License-Identifier = "LicenseRef-Microchip-MCC"
